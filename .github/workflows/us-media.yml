name: Collect US media

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0,6,12,18 * * 1-5"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m research_desk collect --theme us-media --output-dir output/us-media
      - uses: actions/upload-artifact@v4
        with:
          name: us-media-${{ github.run_id }}
          path: output/us-media
          retention-days: 14
